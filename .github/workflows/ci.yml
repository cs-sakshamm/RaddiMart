name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest unit tests
        run: npm run test

  playwright-tests:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    env:
      # The browser suites stub Supabase at the network layer. They only need
      # a syntactically valid browser config to build the app in CI; no live
      # project, credentials or secrets are used here.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_stub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application (needed for served tests)
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:ui

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  local-migration-validation:
    name: Local migration validation
    runs-on: ubuntu-latest
    needs: lint-and-build
    env:
      # Local Supabase uses the documented development password. This is not a
      # secret; it is only used by psql against the ephemeral 127.0.0.1 stack.
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker (for local Supabase)
        run: |
          sudo dockerd &
          sleep 5
          docker info > /dev/null 2>&1 || { echo "Docker daemon failed to start"; exit 1; }

      - name: Install Supabase CLI
        run: |
          npm install -g supabase@3.3.0
          supabase --version

      - name: Start local Supabase
        run: supabase start

      - name: Apply local migrations
        run: supabase migration up

      - name: Run migration validation tests
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/tests/001_migration_validation.sql

      - name: Run RLS and listing workflow validation
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -f supabase/tests/002_phase3_phase4_rls_validation.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true

  dependency-check:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitHub secret scanning
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:secrets"
        continue-on-error: true

      - name: Scan for exposed secrets with trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.before || github.event.repository.default_branch }}
          fail: true
        continue-on-error: true
