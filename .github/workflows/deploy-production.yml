name: Deploy Production

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  SUPABASE_CLI_VERSION: '3.3.0'
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Production validation and Vercel handoff
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Verify Vercel deployment configuration
        run: |
          test -f vercel.json
          test -f dist/index.html
          jq -e '
            .framework == "vite" and
            .buildCommand == "npm run build" and
            .outputDirectory == "dist" and
            (.rewrites | length) > 0
          ' vercel.json > /dev/null
          echo "Vercel SPA configuration and dist artifact verified."

      - name: Install Supabase CLI
        run: |
          npm install -g supabase@${{ env.SUPABASE_CLI_VERSION }}
          supabase --version

      - name: Authenticate Supabase CLI
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link to target Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify target project reference
        run: |
          LINKED_REF=$(cat supabase/.temp/project-ref)
          if [ "$LINKED_REF" != "$SUPABASE_PROJECT_REF" ]; then
            echo "ERROR: Linked project ref '$LINKED_REF' does not match expected '$SUPABASE_PROJECT_REF'"
            exit 1
          fi
          echo "Linked project ref verified: $LINKED_REF"

      - name: Validate pending migrations before applying
        run: supabase db push --remote --dry-run --yes

      - name: Apply pending migrations
        run: supabase db push --remote --yes

      - name: Verify critical database objects
        # A single SELECT keeps this step read-only. PostgreSQL evaluates the
        # division-by-zero branch only when an expectation fails, so the CLI
        # exits non-zero without depending on jq or JSON parsing. The SQL is
        # kept on one line because Supabase CLI 3.3.0 rejects a trailing newline.
        run: |
          supabase db query --remote --read-only "select case when (9 - (select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('profiles','material_categories','price_rates','recyclers','role_requests','material_lots','transactions','handover_records','scrap_listings'))) = 0 and (select count(*) from pg_tables where schemaname = 'public' and tablename in ('profiles','material_categories','price_rates','recyclers','role_requests','transactions','handover_records','material_lots','scrap_listings') and rowsecurity = false) = 0 and (7 - (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname in ('approve_role_request','handle_new_user','ensure_own_profile','handle_profiles_update','is_admin','current_active_role','uuid_generate_v4'))) = 0 and (select count(*) from auth.users u where not exists (select 1 from public.profiles p where p.id = u.id)) = 0 and (select case when has_table_privilege('authenticated','public.profiles','SELECT') then 0 else 1 end) = 0 then 'OK' else (1 / (select 0))::text end as verification"

      - name: Production handoff
        run: |
          echo "Database validation passed."
          echo "Vercel Git integration deploys the verified dist/ output from main."
